name: Code Correction

on: [push]

jobs:
  format_code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensure commit history

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai autopep8 flake8 pylint

      - name: Get changed Python files
        id: changed_files
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM ORIG_HEAD HEAD -- '*.py')
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Processing files: $CHANGED_FILES"

      - name: Run code correction on changed files
        if: env.CHANGED_FILES != ''
        run: |
          for file in $CHANGED_FILES; do
            echo "Processing: $file"
            python try2.py "$file"
          done

      - name: Commit and push changes
        run: |
          git config --global user.email "murtuza.jambughoda@moschip.com"
          git config --global user.name "MurtazaJ2"
          git diff --quiet || (git add . && git commit -m "Auto-corrected Python files" && git push)
