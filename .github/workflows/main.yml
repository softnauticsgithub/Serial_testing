name: Code Correction

on:
  push:
    branches:
      - branch1

jobs:
  format_code:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensure commit history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai autopep8 flake8 pylint

      - name: Get changed Python files
        id: changed_files
        shell: pwsh
        run: |
          git fetch --depth=2 || true
          $changedFiles = git diff --name-only --diff-filter=AM HEAD^ HEAD -- '*.py'
          echo "CHANGED_FILES=$changedFiles" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "Changed files:"
          echo $changedFiles
      
      - name: Run code correction on changed files
        if: env.CHANGED_FILES != ''
        run: |
          echo "Processing files: $env:CHANGED_FILES"
          foreach ($file in $env:CHANGED_FILES -split "`n") {
            echo "Processing: $file"
            python try2.py "$file"
          }
          
      - name: Commit and push changes
        run: |
          git config --global user.email "murtuza.jambughoda@moschip.com"
          git config --global user.name "MurtazaJ2"
          git diff --quiet || (git add . && git commit -m "Auto-corrected added and modified Python files" && git push)
