name: Code Correction

on:
  push:
    branches:
      - branch1

jobs:
  format_code:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai autopep8 flake8 pylint

      - name: Get changed Python files
        id: changed_files
        run: |
          git fetch --depth=2 || true
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- '*.py')
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Changed files: $CHANGED_FILES"
      
      - name: Set changed files for matrix
        id: files
        run: |
          echo "files=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- '*.py' | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_ENV

  process_files:
    needs: format_code
    runs-on: windows-latest
    strategy:
      matrix:
        file: ${{ fromJson(env.files) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai autopep8 flake8 pylint

      - name: Run code correction on file
        run: |
          echo "Processing file: ${{ matrix.file }}"
          python main.py "${{ matrix.file }}"
          
      - name: Commit and push changes
        run: |
          git config --global user.email "murtuza.jambughoda@moschip.com"
          git config --global user.name "MurtazaJ2"
          git diff --quiet || (git add . && git commit -m "Auto-corrected added and modified Python files" && git push)
